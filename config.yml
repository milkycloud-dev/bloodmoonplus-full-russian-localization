# ============================================================
#  BloodMoonPlus - configuración principal
# ============================================================

# Mundos donde ocurre el evento (si un horario no define los suyos).
worlds:
  - world

# ------------------------------------------------------------
#  PROGRAMACIÓN DEL EVENTO - 2 MODOS
# ------------------------------------------------------------
#
#  MODO 1: "weekly" (por defecto)
#  Por día de la semana a hora fija en zona horaria (hora México).
#  Cada día puede tener una o varias horas. Un día sin entrada NO tiene evento.
#  Ejemplo: cada LUNES a las 14:00 hora México:
#
#    schedule:
#      mode: weekly
#      days:
#        MONDAY:
#          - "14:00"
#
#  MODO 2: "interval"
#  Cada N horas reales (ej. cada 72h = cada 3 días reales).
#  El temporizador corre aunque el servidor esté apagado.
#  Ejemplo: cada 72 horas:
#
#    schedule:
#      mode: interval
#      interval-hours: 72
#
#  Las horas SIEMPRE entre comillas: "21:30"  (formato 24 h).
#  En modo weekly, cada hora puede ser texto simple o un bloque con opciones:
#        - time: "20:40"
#          difficulty: 3          # x3 (triple)
#          duration-minutes: 15
#          worlds: [world]        # opcional
# ------------------------------------------------------------
schedule:
  enabled: true
  mode: weekly                   # weekly | interval
  timezone: "Europe/Moscow"
  interval-hours: 72            # solo para modo interval
  grace-seconds: 180            # si el servidor estaba apagado a la hora exacta, aún se dispara dentro de este margen
  skip-if-no-players: true      # no inicia el evento si el mundo está vacío
  warnings-minutes: [10, 5, 1]  # avisos antes de empezar
  days:
    MONDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    TUESDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    WEDNESDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    THURSDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    FRIDAY:
      - time: "14:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    SATURDAY:
      - time: "14:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15
    SUNDAY:
      - time: "14:00"
        difficulty: 1.4
        duration-minutes: 15
      - time: "19:00"
        difficulty: 1.6
        duration-minutes: 15
      - time: "23:00"
        difficulty: 1.6
        duration-minutes: 15

# ------------------------------------------------------------
#  EVENTO
# ------------------------------------------------------------
event:
  duration-minutes: 15
  global: true                 # true: el evento arranca en TODOS los mundos cargados al mismo tiempo
                               #       (hordas, jefes, barra, noche y participantes en cada mundo).
                               # false: solo en los mundos de la lista "worlds" de abajo.
  lock-night: true              # fija la noche durante el evento
  night-time-ticks: 18000
  end-time-ticks: 23000         # hora del mundo al terminar (amanecer cercano)
  clear-weather: true
  first-wave-delay-seconds: 3   # segundos exactos del arranque a la primera horda
  remove-mobs-on-end: true
  force-difficulty: true           # sube la dificultad del mundo a EASY si está en Pacífico (necesario para spawnear mobs); se restaura al terminar
  protect-terrain: true            # las explosiones de mobs (creepers, etc.) NO rompen bloques; el jefe de la Luna SÍ los rompe (como el Wither vanilla)
  block-wither-spawn: false        # bloquea el spawn de CUALQUIER Wither excepto el jefe de la Luna (tag bloodmoon_boss); desactívalo si quieres Withers normales
  reward-on-stop: false         # dar recompensa a supervivientes si se detiene con /luna stop
  commands-on-start: []         # consola; {world}
  commands-on-end: []
  survivor-commands: []         # consola, por superviviente; {player}  ej: "eco give {player} 500"

# ------------------------------------------------------------
#  ANUNCIOS DE CHAT
#  Por defecto SOLO se anuncian hordas, jefes y loot. Todo lo demás
#  (muertes de mobs, muertes de jugadores, inicio/fin del evento,
#  especiales, supervivientes y avisos) está apagado para que el chat
#  no se sature. Cambia a true lo que quieras volver a ver.
#  Efectivo con /luna reload
# ------------------------------------------------------------
announce:
  horde: true                 # "¡Las hordas descienden sobre <jugador>!"
  bosses: true                # aparición de jefes, su caída y el top de daño
  loot: true                  # drop LEGENDARIO / MÍTICO conseguido
  mob-kills: false            # "Nova ha matado a Zombi Sanguinario" (1 de cada 5 muertes)
  player-deaths: false        # "Nova ha muerto por <causa>"
  event: true                # inicio, fin y resumen del evento
  specials: false             # eclipse, tormenta, niebla, silencio
  survivors: true            # resultados de supervivientes
  warnings: true             # avisos 10/5/1 min antes de que empiece

# ------------------------------------------------------------
#  DIFICULTAD / СЛОЖНОСТЬ
#  Множитель N (x1 базовый, x100, x1000...). Каждая характеристика:
#      значение = базовая * (1 + (N - 1) * factor)
#  Все параметры полностью настраиваются без пересборки плагина.
# ------------------------------------------------------------
difficulty:
  default: 1.0
  max: 1000.0             # максимальная настраиваемая сложность (до x1000)
  speed-cap: 1.35         # жесткий лимит скорости мобов (не выше +35%, защищает от глитчей сквозь стены)
  max-health-cap: 2048.0  # максимальное здоровье мобов (2048 HP в соответствии с лимитами ядра Paper)
  max-horde-size-multiplier: 1.5 # лимит размера волны орды (защищает от лагов и переполнения сущностей)
  level:
    enabled: true         # отображение уровня мобов на основе сложности
    format: "<gray>[<gradient:#ff5555:#ffaa00>Ур. {level}</gradient>] {name}" # формат титула моба
    always-visible: false # true = видеть имя сквозь блоки, false = ванильное наведение
    store-pdc: true       # сохранять уровень в PDC (Keys.LEVEL и levelledmobs:level)
  bosses:
    scale-count-max: 1    # строго 1 босс за спавн (масштабируются только характеристики и награды)
  scaling:
    health: 0.35         # здоровье мобов (+35% за уровень сложности)
    damage: 0.35         # урон мобов (+35% за уровень сложности)
    speed: 0.05          # прирост скорости (ограничен speed-cap)
    horde-size: 0.0      # множитель размера орды (0.0 = фиксированный размер, не спавнит 3000 мобов)
    spawn-speed: 0.0     # множитель частоты орды (0.0 = строго постоянный интервал, не ускоряет до 4 сек)
    loot-chance: 0.35    # шанс выпадения лута
    rarity-luck: 0.6     # удача для редких категорий лута

# ------------------------------------------------------------
#  HORDAS
# ------------------------------------------------------------
horde:
  enabled: true
  interval-seconds: 40
  min-interval-seconds: 40
  base-size: 3
  wave-max-size: 10
  max-alive-per-player: 12
  spawn-distance: { min: 16, max: 28 }
  require-armor:
    enabled: false
    min-pieces: 4
    materials: [DIAMOND, NETHERITE]
  mobs:
    - type: ZOMBIE
      weight: 35
      health: 40
      damage-multiplier: 1.5
      speed-multiplier: 1.04
      name: "<red>Кровавый зомби"
      equipment: { head: IRON_HELMET, main-hand: IRON_SWORD }
      equipment-chance: 0.4
    - type: SKELETON
      weight: 25
      health: 35
      damage-multiplier: 1.4
      speed-multiplier: 1.02
      name: "<red>Кровавый скелет"
      equipment: { head: IRON_HELMET }
      equipment-chance: 0.4
    - type: HUSK
      weight: 12
      health: 40
      damage-multiplier: 1.5
      speed-multiplier: 1.04
      name: "<gold>Багровый кадавер"
    - type: SPIDER
      weight: 15
      health: 30
      damage-multiplier: 1.4
      speed-multiplier: 1.05
      name: "<red>Кровавый паук"
    - type: DROWNED
      weight: 10
      health: 40
      damage-multiplier: 1.4
      name: "<blue>Бездный утопленник"
    - type: STRAY
      weight: 8
      health: 35
      damage-multiplier: 1.4
      name: "<gray>Ледяной зимогор"
    - type: BOGGED
      weight: 8
      health: 30
      damage-multiplier: 1.35
      name: "<green>Болотный скелет"
    - type: PILLAGER
      weight: 8
      health: 40
      damage-multiplier: 1.4
      equipment: { main-hand: CROSSBOW }
      equipment-chance: 0.6
      name: "<dark_gray>Лунный разбойник"
    - type: VINDICATOR
      weight: 4
      health: 48
      damage-multiplier: 1.3
      equipment: { main-hand: IRON_AXE }
      equipment-chance: 0.4
      name: "<red>Багровый поборник"
    - type: WITHER_SKELETON
      weight: 3
      health: 40
      damage-multiplier: 1.35
      name: "<dark_red>Малый палач"
      loot-table: mob_elite

# ------------------------------------------------------------
#  LOOT
# ------------------------------------------------------------
loot:
  default-table: mob_horde
  survivor-table: survivors
  direct-to-inventory: false    # true: el loot va directo al inventario del que mata
  require-player-kill: true
  keep-vanilla-drops: false
  glow-rarities: [LEGENDARIO, MITICO]   # items que brillan e ignoran lava/explosiones al caer
