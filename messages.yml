LocalesVersion: "2.0.0"
LanguageName: "Russian"

# ==================== Общие ====================
prefix: "<dark_red><bold>🌙 Кровавая Луна</bold> <dark_gray>» <reset>"
no-permission: "<red>У вас нет прав на выполнение этого действия."
unknown-world: "<red>Этот мир не существует или не загружен."
general-error: "<red>Произошла ошибка при обработке вашего запроса."
plugin-reloaded: "<green>Конфигурация успешно перезагружена."
bed-not-allowed: "<red>Вы не можете спать во время Кровавой Луны."
dying-results-inventory-loss: "<dark_red><bold>Смерть во время Кровавой Луны приводит к потере инвентаря."
dying-results-xp-loss: "<dark_red><bold>Смерть во время Кровавой Луны сбрасывает ваш опыт."

# ==================== Событие ====================
event:
  title: "<dark_red><bold>🌙 КРОВАВАЯ ЛУНА"
  subtitle: "<red>Выживите до рассвета <gray>(x{difficulty})"
  start: "<red>Кровавая Луна началась! <gray>Сложность <red>x{difficulty}<gray> · Длительность <white>{minutes} мин"
  end: "<green>Кровавая Луна закончилась. Наступает рассвет!"
  stopped: "<yellow>Кровавая Луна была остановлена."
  bar: "<dark_red>🌙 Кровавая Луна <gray>· <white>{time} <gray>· <red>x{difficulty}"
  summary-header: "<gold>Лучшие охотники этой ночи:"
  summary-line: "<gray>{pos}. <white>{player} <dark_gray>- <red>{kills} убийств"
  survivors: "<green>Вы пережили Кровавую Луну! Получена награда выжившего."
  horde-descending: "<dark_red><bold>⚡ Орда нападает на игрока <white>{player}<dark_red>! ⚡"
  player-died: "<dark_red>☠ <white>{player} <dark_red>погиб во время Кровавой Луны. <gray>(<white>{cause}<gray>)"
  mob-slain: "<gray>× <white>{player} <gray>убил <red>{mob}<gray>."
  death-cause-unknown: "<gray>поглощен ночью"
  wither-blocked: "<red>Визер запрещен на этом сервере. Может появиться только босс Кровавой Луны."
  survivors-header: "<gold>Выжившие в Кровавой Луне в мире {world}:"
  survivors-none: "<gray>Нет игроков, имеющих право на награду выжившего в {world}."
  survivor-disqualified-death: "<red>Вы погибли и потеряли право на награду выжившего."
  survivor-insufficient-participation: "<yellow>Вы участвовали недостаточно долго для получения награды выжившего."
  already-active: "<red>В мире {world} уже активна Кровавая Луна."
  not-active: "<red>В мире {world} сейчас нет активной Кровавой Луны."
  cannot-stop-world: "<red>Вы не можете остановить Кровавую Луну в этом мире."
  world-permanent: "<red>В этом мире Кровавая Луна действует постоянно."

# ==================== Расписание ====================
schedule:
  warning: "<yellow>Кровавая Луна начнется через <red>{min} мин. <gray>(x{difficulty})<yellow>. Приготовьтесь!"
  warning-title: "<dark_red><bold>Кровавая Луна приближается!"
  warning-body: "<red>Опыт умножен, а с мобов выпадает бонусный лут.
<red>Мобы усилены и накладывают особые эффекты."

# ==================== Босс ====================
boss:
  spawn: "<dark_red>☠ Появился босс {boss}<dark_red>!"
  enraged: "<dark_red><bold>{boss} <dark_red><bold>В ЯРОСТИ! <red>Он становится быстрее и опаснее."
  killed: "<green>Босс {boss} <green>повержен! Решающий удар: <white>{player}<green>."
  top-header: "<gold>Топ урона по боссу:"
  top-line: "<gray>{pos}. <white>{player} <dark_gray>- <red>{damage} урона"
  top-reward: "<gold>За нанесенный боссу урон вы получаете дополнительную награду."
  disabled: "<yellow>Босс Кровавой Луны отключен в этом мире."
  spawn-failed: "<red>Не удалось призвать настроенного босса Кровавой Луны."
  mythic-not-found: "<red>Моб MythicMobs '{name}' не найден в {world}."
  mythic-unavailable: "<red>MythicMobs недоступен или несовместим в {world}."
  mythic-fallback: "<gray>Переключение на стандартного босса Кровавой Луны в {world}."

# ==================== Лут ====================
loot:
  broadcast: "<yellow><white>{player} <yellow>получил {item} <dark_gray>[{rarity}<dark_gray>]<yellow>!"

# ==================== Предметы ====================
item:
  rarity-line: "<gray>Редкость: {rarity}"
  serial-line: "<dark_red>Экземпляр <white>#{serial}<gray>/{limit}"

# ==================== Команды ====================
cmd:
  usage: "<yellow>Использование: /luna <next|start|stop|difficulty|boss|horde|killmobs|give|items|chances|reload|survivors>"
  reloaded: "<green>Конфигурация перезагружена."
  started: "<green>Кровавая Луна запущена в {world}."
  stopped: "<yellow>Кровавая Луна остановлена в {world}."
  stopped-all: "<yellow>Все события остановлены."
  status-none: "<gray>Сейчас нет активной Кровавой Луны."
  status-line: "<red>● {world} <gray>· осталось <white>{time} <gray>· сложность <red>x{difficulty}"
  next-line: "<gray>Следующая: <white>{when} <gray>(через {in}) · x{difficulty}"
  next-header: "<gold>Предстоящие Кровавые Луны:"
  next-entry: "<dark_gray>- <white>{when} <gray>· через {in} · <red>x{difficulty}"
  next-none: "<gray>Расписание не настроено."
  usage-difficulty: "<yellow>Использование: /luna difficulty <x3|x2|triple> [мир]"
  difficulty-set: "<green>Сложность изменена на x{difficulty}. Влияет на всех новых мобов."
  usage-boss: "<yellow>Использование: /luna boss <id> [мир]. Боссы: {bosses}"
  boss-spawned: "<green>Босс {boss} успешно призван."
  boss-failed: "<red>Не удалось призвать босса {boss} (проверьте id и наличие игроков рядом)."
  horde-spawned: "<green>Сгенерирована орда: {count} мобов."
  killed: "<green>Удалено {count} мобов Кровавой Луны."
  usage-give: "<yellow>Использование: /luna give <игрок> <предмет> [кол-во]"
  player-unknown: "<red>Игрок {player} не найден."
  item-unknown: "<red>Предмет {item} не существует (см. /luna items)."
  given: "<green>Выдано {amount}x {item} игроку {player}."
  items-header: "<gold>Доступные предметы:"
  usage-chances: "<yellow>Использование: /luna chances <таблица>"
  table-unknown: "<red>Таблица {table} не найдена."
  survivors-header: "<gold>Кандидаты на награду выжившего в {world}:"
  survivors-line: "<gray>- <white>{player} <gray>(участие: {seconds} сек.)"
  survivors-none: "<gray>Нет подходящих кандидатов на выживание в {world}."

